# =============================================================================
# logpipe.conf - canonical reference configuration for logpipe v1.0.0
# =============================================================================
# Syntax: one "key = value" pair per line. '#' or ';' starts a comment (full
# line or trailing). Keys are case-insensitive and trimmed; values are trimmed.
#
# Loading happens in layers with increasing priority:
#   1. this file plus every "include =" target (recursive, include-cycle safe);
#      within one layer, later keys overwrite earlier ones
#   2. the activated profile: "profile.<name>.<key>" groups apply only when
#      "active_profile = <name>" selects them (they override layer 1)
#   3. environment variables LOGPIPE_<KEY> (dots become underscores, e.g.
#      LOGPIPE_FILTER_LEVEL) override everything; disable with --no-env
#
# This file uses the canonical (dotted) key spellings everywhere. Deprecated
# legacy spellings still work but warn at load time - they are listed in the
# dedicated section at the bottom of this file.
# =============================================================================

# -----------------------------------------------------------------------------
# Inputs
# -----------------------------------------------------------------------------

# Files to tail, comma separated. Every entry gets a 1-based declaration index
# that the source.<N>.tags keys below refer to. Three entry forms exist:
#   <path>            tail a regular file (created later is picked up too)
#   stdin:            read standard input line by line as an extra source
#   glob:<pattern>    tail every file matching <dir>/<mask> ("*.log", "a?c"),
#                     discovering new matches and retiring vanished files
# Repeated "input.files =" lines append. At least one entry is required.
input.files = logs/app.log, logs/error.log

# Source-level metadata attached to every line of the N-th input entry
# (1-based, in input.files declaration order). Comma-separated k=v pairs; a
# bare word becomes <word>="true". Tags are visible to the filter DSL through
# field("key") and are overwritten by extracted KV fields on a key clash.
# source.1.tags = env=prod, tier=edge
# source.2.tags = channel=console

# Comma-separated glob patterns applied to glob: sources AFTER the include
# match: a candidate matching any exclude pattern is never tailed (matched
# against the file name and the full path).
# glob.exclude = debug.*, secret.log

# -----------------------------------------------------------------------------
# Output file and rotation
# -----------------------------------------------------------------------------

# Rolling output: the active file lives in output.dir; when it exceeds
# rotate.size_bytes it becomes <name>_1.<ext> and older backups shift by one,
# keeping at most rotate.backups files. Every freshly created output file
# (including every rotation product) starts with one versioned header line:
#   #logpipe v1.0.0 <format> created=<UTC>
# Files that are appended to (restart resume, same-day rotation) are not
# stamped again. Compressed files gain a ".rle" extension, encrypted a ".enc".
output.dir = out
output.file = logpipe_out.log
rotate.size_bytes = 1048576
rotate.backups = 5

# Rotate the output when the calendar date changes: active file names carry
# the local date (<stem>_<YYYYMMDD><ext>). Coexists with the size trigger.
rotate.daily = false

# Write each input source into its own output file; names embed a sanitized
# form of the source identifier (logs/app.log -> logpipe_out_app_log.log).
per_source_files = false

# -----------------------------------------------------------------------------
# Output encoding: line format, compression, encryption, buffering
# -----------------------------------------------------------------------------

# Output line format: "text" or "json_lines".
#   text       : <timestamp> [LEVEL] [source] message |crc=XXXXXXXX
#   json_lines : {"ts":"...","level":"...","source":"...","message":"...","crc":N}
# The CRC-32 always covers the exact serialized prefix before the crc field.
output.format = text

# Per-line compression: "none" (default) or "rle" - the self-implemented
# run-length container (rle.h) wraps every formatted line as one
# length-prefixed frame. Decoding yields the header line first.
output.compress = none

# Lightweight output encryption (applied AFTER compression): non-empty turns
# on the XOR keystream container (xcrypt.h) per output file. The password is
# a secret: diagnostics and --dump-config/--check-config only show "***".
# encrypt.password =

# Batched write buffer: formatted output accumulates in memory and is flushed
# when either threshold is crossed, on rotation, or at close(). 0 disables a
# threshold; both 0 = unbuffered. A crash can lose what is still buffered.
write.buffer_lines = 0
write.buffer_bytes = 0

# -----------------------------------------------------------------------------
# Filtering (three stages, evaluated in this order)
# -----------------------------------------------------------------------------

# Stage 1, optional DSL expression (dsl.h). Operators: AND, OR, NOT
# (case-insensitive), =, !=, >=, >, <=, <, CONTAINS, STARTS_WITH, ENDS_WITH,
# MATCHES (ECMAScript regex). Fields: level (severity-ordered), msg, src;
# kv("key") / field("key") read extracted KV fields and source tags.
filter.expr =
# filter.expr = level >= "WARN" AND (msg CONTAINS "timeout" OR src ENDS_WITH ".log")

# Stage 2, minimum level (DEBUG < INFO < WARN < ERROR, or a custom level
# registered below; RAW unparsed lines pass every threshold).
filter.level = INFO

# Stage 3, optional case-insensitive keyword on the message (empty = off).
filter.keyword =

# -----------------------------------------------------------------------------
# Rate limiting and field extraction
# -----------------------------------------------------------------------------

# Fixed-window rate limit: lines beyond rate.max_lines_per_sec per second are
# dropped and counted separately in the run summary (0 = unlimited).
rate.max_lines_per_sec = 0

# Run the key=value field extractor over every admitted line ("user=bob
# host=web-01", quoted values supported). Extracted fields feed the DSL
# kv("key") syntax, the Top-N field-value statistics and the extraction-rate
# diagnostic printed at shutdown.
extract.kv = false

# -----------------------------------------------------------------------------
# Fan-out outputs (optional, replaces the single output when any key is set)
# -----------------------------------------------------------------------------
# Declare named outputs with output.<N>.<attr> keys; indices start at 1 and
# may be sparse (order is by index). Each branch has its own file, format,
# compression, level threshold, DSL filter and ordered transform chain. The
# rotation knobs and output.dir stay shared with the global settings. When no
# output.<N>.* key exists, the single-output settings above map onto one
# default output named "default" (backward compatible).
#
# output.1.name = audit
# output.1.file = audit.log
# output.1.format = text
# output.1.compress = none
# output.1.level = INFO
# output.1.filter.expr = kv("audited") = "yes"
# output.1.transform = tag:audited=yes|uppercase
# output.1.transform.position = before
#
# output.2.name = jsonl
# output.2.file = jsonl.log
# output.2.format = json_lines
# output.2.compress = rle
# output.2.level = WARN
# output.2.transform = uppercase
# output.2.transform.position = after
#
# transform: '|'-separated steps applied in order:
#   uppercase | trim | replace:pat->repl | tag:name=value
# transform.position: "before" runs the chain ahead of the branch filter (the
# filter sees the transformed record, which is also the one written);
# "after" (default) transforms only the accepted record right before writing.

# -----------------------------------------------------------------------------
# Prometheus statistics export (optional)
# -----------------------------------------------------------------------------

# When stats.interval_sec > 0, a Metrics snapshot is exported every interval
# into stats.dir as a timestamped .prom file; stats.keep_files bounds the
# retention (oldest exports are pruned after each write). A final export
# happens at shutdown so short runs still produce a snapshot.
stats.interval_sec = 0
stats.dir = stats
stats.keep_files = 10

# -----------------------------------------------------------------------------
# Tail behaviour, resume state and replay
# -----------------------------------------------------------------------------

# Poll interval between tail rounds (20..60000 ms) and the offset state file
# that lets a restarted logpipe resume where the previous run stopped
# (empty disables persistence). Offsets count complete lines only.
tail.poll_ms = 500
state.offset_file = logpipe_offsets.txt

# Time-stamp replay (see index_sidecar.h): when replay.since is set, every
# tailed file is positioned at startup at the sidecar index entry closest
# at/before the requested time (full scan when no usable index exists) and
# lines older than the timestamp are skipped; the first line whose in-line
# timestamp is >= since is the first one emitted. replay.index_interval_bytes
# is the sidecar cadence: one [offset -> last line timestamp] entry every N
# consumed bytes per tailed file ("<file>.idx", 64..1073741824, 0 = off).
replay.since =
# replay.since = 2026-09-01 00:00:00
replay.index_interval_bytes = 4096

# -----------------------------------------------------------------------------
# Runtime knobs
# -----------------------------------------------------------------------------

# read.chunk_bytes: size of one read() block while tailing (128..1048576).
# queue.capacity: capacity of the reader-to-main queue in lines (1..1000000);
# producers apply back-pressure when full.
read.chunk_bytes = 8192
queue.capacity = 1024

# Stop automatically after N seconds (0 = run until interrupted).
run.duration_sec = 0

# Graceful stop trigger: the run ends as soon as this file appears (empty = off).
run.stop_file =

# Diagnostics: debug | info | warn | error; log file (stderr if empty).
diag.level = info
diag.file =

# -----------------------------------------------------------------------------
# Profiles and custom levels
# -----------------------------------------------------------------------------

# Select a pre-defined key group (see the profile.<name>.<key> entries below;
# the selection itself can come from LOGPIPE_ACTIVE_PROFILE). Selecting an
# undefined profile is a hard error.
active_profile =

# profile.fast.tail.poll_ms = 50
# profile.fast.filter.level = ERROR
# profile.verbose.filter.level = DEBUG
# profile.verbose.filter.keyword = trace

# Custom severity levels: register <NAME> with a numeric value 1..999; the
# name then works as a threshold value, as the level word inside ingested
# lines and as a level literal in filter.expr comparisons (thresholds are
# plain integer comparisons against the built-in ordinals).
# level.register.AUDIT = 2
# level.register.TRACE = 0

# -----------------------------------------------------------------------------
# Deprecated keys (still accepted, each load warns - migrate to the canonical
# spelling shown on the right; values behave identically)
# -----------------------------------------------------------------------------
#
#   deprecated key         canonical replacement
#   ------------------     -----------------------
#   input.file             input.files
#   output_format          output.format
#   rotate_daily           rotate.daily
#   extract_kv             extract.kv
#   max_lines_per_sec      rate.max_lines_per_sec
#   stop_file              run.stop_file
#
# Example of the old spellings (do NOT mix into new configs):
# input.file = legacy.log
# output_format = json_lines
# rotate_daily = true
# extract_kv = true
# max_lines_per_sec = 1000
# stop_file = stop.now
