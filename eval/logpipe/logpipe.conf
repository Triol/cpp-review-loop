# logpipe configuration. One key = value per line; '#' or ';' starts a comment.

# Files to tail, comma separated (repeated "input.file =" lines also work).
# The special entry "stdin:" reads standard input line by line as an extra
# source, e.g. input.files = logs/app.log, stdin: (stdin alone also works).
input.files = logs/app.log, logs/error.log

# Rolling output: the active file lives in output.dir; when it exceeds
# rotate.size_bytes it becomes logpipe_out_1.log and older backups shift to
# _2, _3, ... keeping at most rotate.backups files.
output.dir = out
output.file = logpipe_out.log
rotate.size_bytes = 1048576
rotate.backups = 5

# Output line format: "text" (default) or "json_lines" (one single-line JSON
# object per record with ts, level, source, message and crc fields).
output_format = text

# Level threshold (DEBUG < INFO < WARN < ERROR) and an optional case-
# insensitive keyword (empty disables keyword filtering).
filter.level = INFO
filter.keyword =

# Rate limit: lines beyond max_lines_per_sec are dropped and counted in the
# run summary (0 = unlimited).
max_lines_per_sec = 0

# Tail behaviour: poll interval and the offset state file that lets a
# restarted logpipe continue where the previous run stopped (empty = off).
tail.poll_ms = 500
state.offset_file = logpipe_offsets.txt

# Diagnostics: debug | info | warn | error; log file (stderr if empty).
diag.level = info
diag.file =

# Graceful stop: end the run as soon as this file appears (empty = off).
stop_file =

# Stop automatically after N seconds (0 = run until interrupted).
run.duration_sec = 0

# Output compression: "none" (default) or "rle" (self-implemented run-length
# encoding; compressed files carry a ".rle" extension).
output.compress = none

# Rotate the output when the calendar date changes (active file names carry
# the date); coexists with the size trigger below (either one rotates).
rotate.daily = false

# Write each input source into its own output file (names embed a sanitized
# form of the source identifier).
per_source_files = false
